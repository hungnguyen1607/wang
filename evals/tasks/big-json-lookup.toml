id = "big-json-lookup"
prompt = "In users.json, what is the email of the user with id 3141, and how many users are active?"
setup = "awk 'BEGIN{printf \"[\"; for(i=1;i<=5000;i++){ printf \"%s{\\\"id\\\":%d,\\\"name\\\":\\\"user%d\\\",\\\"email\\\":\\\"u%03d-%d@ex.org\\\",\\\"active\\\":%s}\", (i>1?\",\":\"\"), i, i, (i*7)%1000, i, (i%3?\"true\":\"false\") } print \"]\"}' > users.json"
[check]
reply_contains = ["u987-3141@ex.org", "3334"]
