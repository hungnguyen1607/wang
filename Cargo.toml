[workspace]
resolver = "3"
members = ["crates/wang-tokens", "crates/wang-trace", "crates/wang-jail", "crates/wang-daemon", "crates/wang-evals", "crates/wang-bench", "crates/wang-proxy", "crates/wang-browser", "crates/wang-vm-agent", "crates/wang-vm", "crates/wang-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "macros", "process", "time", "io-std", "io-util", "sync", "fs", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
dirs = "5"
chrono = "0.4"
regex = "1"
futures = "0.3"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
